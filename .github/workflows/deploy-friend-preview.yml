name: Deploy RecordCove Friend Preview

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Private prerelease tag containing the approved macOS archive
        required: true
        default: v0.1.0-recordcove-preview.1
        type: string

permissions:
  contents: read

jobs:
  deploy-portal:
    name: Deploy protected preview portal
    uses: PrestonCoreSystems/core-infrastructure/.github/workflows/reusable-cloudflare-deploy.yml@v1
    with:
      project-type: pages
      project-name: recordcove-preview
      working-directory: .
      install-directory: .
      build-command: npm run build
      output-directory: dist
      package-manager: npm
      environment: prod
      cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  publish-package:
    name: Publish verified preview package
    runs-on: preston-shared
    environment: prod
    env:
      RELEASE_TAG: ${{ inputs.release-tag }}
      ARCHIVE_NAME: RecordCove-macOS-preview.zip
      EXPECTED_BYTES: "464111370"
      EXPECTED_SHA256: 6e03ebcf15aeb97dfc506a626053e9dda82ecac4b5e7f112e3d945e9bac903c1
    steps:
      - name: Download approved private prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARCHIVE_NAME" \
            --dir release-artifacts

      - name: Verify exact archive identity
        run: |
          set -euo pipefail
          archive="release-artifacts/$ARCHIVE_NAME"
          test -f "$archive"
          actual_bytes="$(wc -c < "$archive" | tr -d ' ')"
          test "$actual_bytes" = "$EXPECTED_BYTES"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$archive" | shasum -a 256 -c -

      - name: Upload approved archive to protected R2 bucket
        uses: PrestonCoreSystems/core-infrastructure/.github/actions/r2-sync@v1
        with:
          bucket-name: recordcove-preview-downloads
          source-dir: release-artifacts
          destination-prefix: ""
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
